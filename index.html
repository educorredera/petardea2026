<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Petardea Sound</title>
  <meta name="theme-color" content="#111111" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    :root, [data-theme="light"] {
      --bg: #faf8f2;
      --surface: #ffffff;
      --surface-2: #f2eee4;
      --surface-3: #e8e0d0;
      --text: #111111;
      --muted: #625d55;
      --line: rgba(17,17,17,.12);
      --line-strong: rgba(17,17,17,.2);
      --primary: #111111;
      --accent: #ff4fa3;
      --accent-2: #2ed3ff;
      --accent-3: #ffd84d;
      --success: #1b9f5c;
      --danger: #b61e57;
      --radius-sm: 14px;
      --radius-md: 20px;
      --radius-lg: 28px;
      --radius-xl: 36px;
      --shadow: 0 16px 40px rgba(0,0,0,.10);
      --shadow-soft: 0 8px 24px rgba(0,0,0,.06);
      --text-xs: clamp(.75rem,.72rem + .2vw,.875rem);
      --text-sm: clamp(.875rem,.85rem + .25vw,1rem);
      --text-base: clamp(1rem,.97rem + .2vw,1.0625rem);
      --text-lg: clamp(1.125rem,1.05rem + .5vw,1.4rem);
      --text-xl: clamp(1.8rem,1.4rem + 1vw,2.3rem);
    }

    [data-theme="dark"] {
      --bg: #111111;
      --surface: #181818;
      --surface-2: #222222;
      --surface-3: #2d2d2d;
      --text: #faf8f2;
      --muted: #c9c1b4;
      --line: rgba(255,255,255,.12);
      --line-strong: rgba(255,255,255,.22);
      --primary: #faf8f2;
      --accent: #ff67b8;
      --accent-2: #53dbff;
      --accent-3: #ffd84d;
      --success: #4cdf8b;
      --danger: #ff6b96;
      --shadow: 0 16px 40px rgba(0,0,0,.35);
      --shadow-soft: 0 8px 24px rgba(0,0,0,.22);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: Inter, system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top right, rgba(255, 79, 163, .12), transparent 32%),
        radial-gradient(circle at top left, rgba(46, 211, 255, .10), transparent 30%),
        var(--bg);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    img, iframe { display:block; max-width:100%; }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }
    .hidden { display:none !important; }

    .app-shell {
      width: min(100%, 430px);
      margin: 0 auto;
      min-height: 100dvh;
      background: color-mix(in srgb, var(--bg) 90%, transparent);
      position: relative;
      overflow: hidden;
      border-inline: 1px solid var(--line);
    }

    .screen {
      min-height: 100dvh;
      padding-bottom: calc(92px + env(safe-area-inset-bottom));
    }

    .login-screen {
      display: grid;
      align-items: center;
      padding: 28px;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      padding: 22px;
    }

    .brand-mark {
      width: 100%;
      border-radius: 18px;
      background: #fff;
      padding: 14px;
      border: 1px solid var(--line);
      object-fit: contain;
      max-height: 146px;
    }

    .eyebrow {
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      background: color-mix(in srgb, var(--accent) 14%, var(--surface));
      color: var(--primary);
      font-size: var(--text-xs);
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    h1, h2, h3 {
      font-family: Archivo, Inter, sans-serif;
      margin: 0;
      line-height: 1.06;
    }

    .login-title {
      font-size: var(--text-xl);
      margin: 18px 0 10px;
      text-transform: uppercase;
    }

    .lead {
      color: var(--muted);
      font-size: var(--text-sm);
      line-height: 1.55;
    }

    .input-wrap { margin-top: 22px; }

    label {
      display:block;
      font-size: var(--text-xs);
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    input[type="text"] {
      width: 100%;
      border: 1px solid var(--line-strong);
      background: var(--surface-2);
      color: var(--text);
      min-height: 54px;
      padding: 0 16px;
      border-radius: 18px;
      text-transform: uppercase;
      letter-spacing: .06em;
      font-weight: 700;
    }

    input[type="text"]:focus {
      outline: 2px solid var(--accent-2);
      outline-offset: 2px;
    }

    .btn {
      min-height: 54px;
      width: 100%;
      border: 0;
      border-radius: 999px;
      padding: 0 18px;
      font-weight: 800;
      letter-spacing: .03em;
